<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Text Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .glow-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-align: center;
            line-height: 1.1;
            background: linear-gradient(to bottom, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        .sub-text {
            font-size: clamp(1rem, 3vw, 1.5rem);
            margin-top: 1rem;
            color: #888888;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.8;
            animation: fade 3s ease-in-out infinite alternate;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fade {
            0% { opacity: 0.5; }
            100% { opacity: 0.9; }
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.9rem;
            color: #444444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="glow-text">
        HELLO
    </div>

    <div class="sub-text">
        Welcome to my website
    </div>

    <div class="hint">
        สร้างโดยคุณ เปิดดูใน Chrome หรือ Edge ได้เลยครับ
    </div>

</body>
</html>
